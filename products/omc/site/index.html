    <noscript><h1>OMC</h1><p>A closed-loop system that measures and proves the financial value of work shared by people, AI models and agents.</p><p><strong>Status:</strong> Design phase: walking skeleton on synthetic data</p><ul><li><strong>Four entry audits.</strong> Migration qualification, outcome billing audit and vendor bake-off, action authority audit, and human access and disclosure compliance audit.</li><li><strong>Numbers finance can re-run.</strong> Statements can be re-derived from signed inputs with a pinned estimator, so a result does not rest on trust.</li><li><strong>Bounded risk.</strong> A kill switch returns traffic to the baseline, so a trial never leaves you without a safe fallback.</li><li><strong>Your data stays in your tenant.</strong> The measurement runs in the customer’s tenant; a hosted control plane coordinates it.</li></ul><p><strong>Check it yourself:</strong> Run the demo, then verify its signed statements and hash chain with the standalone verifier and the public test vectors.</p><ul><li><a href="/demo/">Demo</a></li><li><a href="/download/">Download</a></li><li><a href="/docs/">Docs</a></li><li><a href="/verify/">Verify</a></li><li><a href="/support/">Support</a></li></ul></noscript>
