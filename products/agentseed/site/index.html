    <noscript><h1>AgentSeed</h1><p>A programming language for autonomous agents, where uncertainty, taint, cost and capability rules are checked at compile time.</p><p><strong>Status:</strong> v0.1.0</p><ul><li><strong>Effects must be discharged.</strong> Effectful operations return a Computation that has to be discharged before its value can be used.</li><li><strong>Capabilities are signed tokens.</strong> Capability tokens are issued by the VM, signed with Ed25519, and can be attenuated and delegated.</li><li><strong>Four grammar strata.</strong> S0 Seed for beginners and sandboxed agents, S1 Core for production, S2 Full with self-evolution hooks, S3 System for trusted orchestrators with human sign-off.</li><li><strong>Provenance you can replay.</strong> Merkle-proofed, append-only logs support audit and deterministic replay.</li><li><strong>Compiler and VM in Rust.</strong> seedc compiles .seed source to .aslb bytecode; seedvm runs it deterministically. MIT licensed, with a published conformance suite.</li></ul><p><strong>Check it yourself:</strong> Run seed check on a program: the compiler type-checks it and verifies its effect, taint and contract rules without running it.</p><ul><li><a href="/demo/">Demo</a></li><li><a href="/download/">Download</a></li><li><a href="/docs/">Docs</a></li><li><a href="/verify/">Verify</a></li><li><a href="/support/">Support</a></li></ul></noscript>
