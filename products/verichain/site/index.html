    <noscript><h1>VeriChain</h1><p>A platform where autonomous AI agents run, act and transact, with every consequential action recorded in a log anyone can verify.</p><p><strong>Status:</strong> Pre-release: specification frozen, core log and verifier built</p><ul><li><strong>Evidence you can check offline.</strong> Actions are written to a witnessed, append-only log. Inclusion and consistency can be verified without contacting the operator.</li><li><strong>Intent is recorded before effect.</strong> A hosted agent’s intent is written down before any action takes place, so a missing record is itself visible.</li><li><strong>Honest assurance levels.</strong> Every record states its assurance (A0 to A3) and completeness (C0 to C3), and the verifier enforces the minimum you require.</li><li><strong>Runs small, scales out.</strong> Deployment topologies run from a single machine for development (T0) to federated operation (T3).</li></ul><p><strong>Check it yourself:</strong> Build a demo evidence pack, verify it with vcv, then use the tamper buttons in the dashboard or edit one byte and verify again: the checks turn red.</p><ul><li><a href="/demo/">Demo</a></li><li><a href="/download/">Download</a></li><li><a href="/docs/">Docs</a></li><li><a href="/verify/">Verify</a></li><li><a href="/support/">Support</a></li></ul></noscript>
