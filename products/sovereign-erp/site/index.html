    <noscript><h1>Sovereign ERP</h1><p>A ledger and period-close kernel whose rules are checked by model checking and formal specifications.</p><p><strong>Status:</strong> Walking skeleton: period controller and ledger port, model-checked</p><ul><li><strong>Period close as a checked state machine.</strong> The Period Controller decides close, reopen and adjustment moves, and its invariants are checked against a TLA+ specification in lockstep.</li><li><strong>An engine-neutral ledger.</strong> A Ledger Port interface with a conformance suite that any ledger engine adapter has to pass.</li><li><strong>Seeded defects are caught.</strong> Deliberately broken variants are run against the checks, and each one is caught with its shortest counterexample.</li></ul><p><strong>Check it yourself:</strong> Run the workspace tests and read the counts: the controller and the TLA+ transcription agree on every reachable state, and each seeded defect is caught with its shortest counterexample.</p><ul><li><a href="/demo/">Demo</a></li><li><a href="/download/">Download</a></li><li><a href="/docs/">Docs</a></li><li><a href="/verify/">Verify</a></li><li><a href="/support/">Support</a></li></ul></noscript>
