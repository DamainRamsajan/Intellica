    <noscript><h1>VeriCrypt</h1><p>An engine that inventories the cryptography in an estate, flags quantum-vulnerable assets, and produces signed reports anyone can verify offline.</p><p><strong>Status:</strong> v2 evidence engine built and tested; later versions in design</p><ul><li><strong>Finds and classifies cryptography.</strong> Reads certificates and keys from folders and probes TLS endpoints. RSA, EC and Ed25519 keys are classified as quantum-vulnerable or resistant, and findings fire on real properties such as weak keys, SHA-1 signatures and plaintext private keys.</li><li><strong>Dated against standards.</strong> Applies NIST IR 8547 (draft) transition years and the CA/Browser Forum certificate-lifetime schedule to forecast what will need replacing.</li><li><strong>Signed, tamper-evident reports.</strong> Reports are signed with SLH-DSA-SHAKE-128f (the FIPS 205 algorithm) and carry a Merkle root. Editing a report is detected, and a report with no signature fails verification.</li><li><strong>Machine-readable inventory.</strong> Produces a CycloneDX 1.7 cryptographic bill of materials that validates against the official schema, plus an HTML report.</li><li><strong>Built for gates.</strong> A diff command compares two scans, and a fail-on threshold returns an exit code your pipeline can act on.</li></ul><p><strong>Check it yourself:</strong> Run vericrypt verify on a report with the signer's public key pinned. Then edit the report and verify again: verification fails.</p><ul><li><a href="/demo/">Demo</a></li><li><a href="/download/">Download</a></li><li><a href="/docs/">Docs</a></li><li><a href="/verify/">Verify</a></li><li><a href="/support/">Support</a></li></ul></noscript>
